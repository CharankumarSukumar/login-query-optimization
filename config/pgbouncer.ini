; Optional connection pooling (replaces "MySQL pooling" in the roadmap)
[databases]
login_db = host=127.0.0.1 port=5432 dbname=login_db

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432
auth_type = scram-sha-256
auth_file = userlist.txt
pool_mode = transaction
max_client_conn = 500
default_pool_size = 20
